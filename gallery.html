<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Circle | Gallery</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0a0a0a; 
            color: #fff; 
            margin: 0; 
            line-height: 1.6;
        }
        
        /* Navigation */
        nav {
            background-color: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cc0000;
        }
        nav a { color: #fff; text-decoration: none; font-weight: bold; font-size: 0.9em; transition: color 0.2s;}
        nav a:hover { color: #cc0000; }
        nav span { font-weight: bold; letter-spacing: 1px; }
        
        /* Header */
        header { 
            text-align: center; 
            padding: 60px 20px; 
            background: linear-gradient(180deg, #3a0000 0%, #0a0a0a 100%);
        }
        header h1 { margin: 0; font-size: 2.2em; text-transform: uppercase; letter-spacing: 2px; }
        header p { color: #aaa; font-size: 1em; margin: 10px 0 0 0; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* Masonry Gallery */
        .gallery-grid {
            column-count: 3;
            column-gap: 15px;
        }
        
        @media (max-width: 900px) { .gallery-grid { column-count: 2; } }
        @media (max-width: 500px) { .gallery-grid { column-count: 1; } }

        /* Media Items */
        .media-item {
            margin-bottom: 15px;
            break-inside: avoid;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background-color: #222;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .media-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(204, 0, 0, 0.4);
        }
        .media-item img, .media-item video {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }
        
        /* Video Icon Overlay */
        .video-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            pointer-events: none;
        }

        /* Lightbox */
        .lightbox {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(5px);
        }
        .lightbox-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .lightbox-content img, .lightbox-content video {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        
        /* Controls */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #cc0000; }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            border: none;
            padding: 15px;
            border-radius: 5px;
            z-index: 1001;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: #cc0000; }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        footer { text-align: center; padding: 40px 20px; font-size: 0.85em; color: #555; border-top: 1px solid #222; margin-top: 50px; }
    </style>
</head>
<body>

   <nav>
        <a href="index.html" style="color: #fff; text-decoration: none; font-weight: bold; font-size: 1.2em; letter-spacing: 1px;">ONE CIRCLE</a>
        <div style="display: flex; gap: 20px;">
            <a href="index.html" style="color: #fff; text-decoration: none; font-weight: bold; font-size: 0.9em;">Home</a>
            <a href="about.html" style="color: #fff; text-decoration: none; font-weight: bold; font-size: 0.9em;">About</a>
        </div>
    </nav>
    <header id="dynamicHeader">
        <!-- Injected by JS -->
    </header>

    <div class="container">
        <!-- Grid injects here -->
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <button class="nav-btn prev-btn" onclick="changeMedia(-1)">&#10094;</button>
        
        <div class="lightbox-content" id="lightboxContent">
            <img id="lightboxImg" style="display: none;" alt="Gallery Image">
            <video id="lightboxVideo" controls style="display: none;"></video>
        </div>
        
        <button class="nav-btn next-btn" onclick="changeMedia(1)">&#10095;</button>
    </div>

    <footer>
        <p>&copy; 2026 One Circle. Maintained by Kebaso Michael Griffins.</p>
    </footer>

    <!-- Include Database -->
    <script src="database.js"></script>

    <script>
        // --- 1. DYNAMIC GALLERY DATA FETCHING ---
        const urlParams = new URLSearchParams(window.location.search);
        const seasonNumber = parseInt(urlParams.get('season'));

        const seasonData = siteDatabase.seasons.find(s => s.seasonNumber === seasonNumber);

        if (!seasonData) {
            document.querySelector('.container').innerHTML = '<h2 style="text-align:center; color:#cc0000; margin-top: 50px;">Gallery not found.</h2>';
            throw new Error("Season not found in database.");
        }

        // --- 2. UPDATE METADATA & HEADER ---
        document.title = `One Circle | Season ${seasonData.seasonNumber} Gallery`;
        
        const dynamicHeader = document.getElementById('dynamicHeader');
        dynamicHeader.innerHTML = `
            <h1>Season ${seasonData.seasonNumber} Gallery</h1>
            <p>${seasonData.title} • ${seasonData.date}</p>
        `;

       // --- 3. GALLERY CONFIGURATION ---
        // Dynamically pull the limits, folder name, and file prefix from the database
        const maxImagesToCheck = seasonData.gallery.maxImages || 0; 
        const maxVideosToCheck = seasonData.gallery.maxVideos || 0; 
        const folderName = seasonData.gallery.folderName || `gallery_season_${seasonData.seasonNumber}`;
        const filePrefix = seasonData.gallery.filePrefix || "1";
        // ------------------------------

        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxVideo = document.getElementById('lightboxVideo');

        let mediaList = [];
        let currentIndex = 0;

        // 4. Build the target list for Images and Videos using the dynamic prefix
        for (let i = 1; i <= maxImagesToCheck; i++) {
            mediaList.push({ type: 'image', src: `${folderName}/${filePrefix} (${i}).jpg`, valid: true });
        }
        for (let i = 1; i <= maxVideosToCheck; i++) {
            mediaList.push({ type: 'video', src: `${folderName}/${filePrefix} (${i}).mp4`, valid: true });
        }
        // 5. Render Grid and Listen for Errors
        mediaList.forEach((media, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'media-item';

            if (media.type === 'image') {
                const img = document.createElement('img');
                img.src = media.src;
                img.loading = "lazy";
                
                img.onerror = () => {
                    wrapper.style.display = 'none';
                    media.valid = false;
                };
                wrapper.appendChild(img);
                
            } else if (media.type === 'video') {
                const vid = document.createElement('video');
                vid.preload = "auto";
                
                vid.onerror = () => {
                    wrapper.style.display = 'none';
                    media.valid = false;
                };

                vid.src = media.src;

                const icon = document.createElement('div');
                icon.className = 'video-icon';
                icon.innerHTML = '▶'; 
                
                wrapper.appendChild(vid);
                wrapper.appendChild(icon);
            }

            // Only open lightbox if the file actually loaded successfully
            wrapper.onclick = () => {
                if (media.valid) openLightbox(index);
            };

            galleryGrid.appendChild(wrapper);
        });

        // 6. Lightbox Logic
        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            document.body.style.overflow = 'auto';
            lightboxVideo.pause(); 
        }

        function changeMedia(direction) {
            let foundValidMedia = false;
            let attempts = 0;

            while (!foundValidMedia && attempts < mediaList.length) {
                currentIndex += direction;
                
                if (currentIndex >= mediaList.length) currentIndex = 0;
                if (currentIndex < 0) currentIndex = mediaList.length - 1;
                
                if (mediaList[currentIndex].valid) {
                    foundValidMedia = true;
                }
                attempts++;
            }
            
            if (foundValidMedia) {
                updateLightbox();
            }
        }

        function updateLightbox() {
            const media = mediaList[currentIndex];
            
            lightboxVideo.pause();
            lightboxVideo.currentTime = 0;

            if (media.type === 'image') {
                lightboxImg.src = media.src;
                lightboxImg.style.display = 'block';
                lightboxVideo.style.display = 'none';
            } else if (media.type === 'video') {
                lightboxVideo.src = media.src;
                lightboxVideo.style.display = 'block';
                lightboxImg.style.display = 'none';
            }
        }

        // 7. Swipe Gestures
        let touchstartX = 0;
        let touchendX = 0;

        lightbox.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        lightbox.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50; 
            if (touchendX < touchstartX - swipeThreshold) changeMedia(1); 
            if (touchendX > touchstartX + swipeThreshold) changeMedia(-1); 
        }

        lightbox.addEventListener('click', e => {
            if (e.target === lightbox || e.target.className === 'lightbox-content') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
