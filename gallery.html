<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Circle | Gallery</title>
    
    <!-- Tailwind CSS & Fonts matching about.html -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Alegreya Sans', sans-serif; 
            background: #0c1220; 
            color: #fff;
        }
        .font-display { font-family: 'Playfair Display', serif; }
        
        /* Masonry Grid */
        .gallery-grid {
            column-count: 3;
            column-gap: 1.5rem;
        }
        @media (max-width: 900px) { .gallery-grid { column-count: 2; } }
        @media (max-width: 500px) { .gallery-grid { column-count: 1; } }

        .media-wrapper {
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }

        /* Lightbox Styles */
        .lightbox {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            inset: 0; 
            background-color: rgba(8, 13, 24, 0.95);
            backdrop-filter: blur(8px);
        }
        .lightbox-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .lightbox-content img, .lightbox-content video {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #d4a853; }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #d4a853; color: #0c1220; border-color: #d4a853; }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }
    </style>
</head>
<body class="w-full min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="absolute top-0 w-full z-50 p-6 flex justify-between items-center">
        <a href="index.html" class="text-white font-bold tracking-widest uppercase hover:text-[#d4a853] transition-colors text-sm">← Back to Home</a>
    </nav>

    <!-- Header injected by JS -->
    <header id="dynamicHeader" class="relative w-full overflow-hidden bg-gradient-to-b from-black/80 to-[#0c1220] flex flex-col items-center justify-center text-center px-6 py-24 min-h-[40vh]">
        <!-- Content Injected -->
    </header>

    <!-- Main Gallery -->
    <main class="w-full flex-grow max-w-7xl mx-auto px-6 py-10">
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <button class="nav-btn prev-btn" onclick="changeMedia(-1)">&#10094;</button>
        
        <div class="lightbox-content" id="lightboxContent">
            <img id="lightboxImg" style="display: none;" alt="Gallery Image">
            <video id="lightboxVideo" controls style="display: none;"></video>
        </div>
        
        <button class="nav-btn next-btn" onclick="changeMedia(1)">&#10095;</button>
    </div>

    <footer class="w-full text-center py-10 px-6 bg-[#080d18] mt-auto">
        <p style="color: rgb(75, 85, 99); font-size: 16px;">© 2026 One Circle. Maintained by Kebaso Michael Griffins.</p> 
    </footer>

    <script>
        function initGalleryPage() {
            fetch('database.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(siteDatabase => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const seasonNumber = parseInt(urlParams.get('season'));
                    const seasonData = siteDatabase.seasons.find(s => s.seasonNumber === seasonNumber);

                    const galleryGrid = document.getElementById('galleryGrid');
                    if (!seasonData) {
                        if (galleryGrid) galleryGrid.innerHTML = '<h2 class="text-center text-[#d4a853] mt-10 text-2xl font-display">Gallery not found.</h2>';
                        throw new Error("Season not found in database.");
                    }

                    // Update Header to match About.html theme
                    document.title = `One Circle | Season ${seasonData.seasonNumber} Gallery`;
                    const dynamicHeader = document.getElementById('dynamicHeader');
                    if (dynamicHeader) {
                        dynamicHeader.innerHTML = `
                            <p class="uppercase tracking-[0.3em] text-sm mb-4" style="color: rgb(212, 168, 83); font-weight: 700;">Season ${seasonData.seasonNumber} Gallery</p> 
                            <h1 class="font-display text-white font-black text-4xl md:text-5xl">${seasonData.title}</h1>
                            <p class="mt-4 max-w-2xl leading-relaxed text-[#b8c4d6] text-lg">${seasonData.date}</p> 
                        `;
                    }

                    const maxImagesToCheck = seasonData.gallery.maxImages || 0; 
                    const maxVideosToCheck = seasonData.gallery.maxVideos || 0; 
                    const folderName = seasonData.gallery.folderName || `gallery_season_${seasonData.seasonNumber}`;
                    const filePrefix = seasonData.gallery.filePrefix || "1";
                    
                    const lightbox = document.getElementById('lightbox');
                    const lightboxImg = document.getElementById('lightboxImg');
                    const lightboxVideo = document.getElementById('lightboxVideo');

                    let mediaList = [];
                    let currentIndex = 0;

                    for (let i = 1; i <= maxImagesToCheck; i++) {
                        mediaList.push({ type: 'image', src: `${folderName}/${filePrefix} (${i}).jpg`, valid: true });
                    }
                    for (let i = 1; i <= maxVideosToCheck; i++) {
                        mediaList.push({ type: 'video', src: `${folderName}/${filePrefix} (${i}).mp4`, valid: true });
                    }

                    if (galleryGrid) {
                        galleryGrid.innerHTML = '';
                        mediaList.forEach((media, index) => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'media-wrapper relative rounded-xl overflow-hidden bg-[#151d2e] cursor-pointer group shadow-lg';

                            if (media.type === 'image') {
                                const img = document.createElement('img');
                                img.src = media.src;
                                img.loading = "lazy";
                                img.className = "w-full h-auto block transition-transform duration-500 group-hover:scale-105";
                                
                                img.onerror = () => {
                                    wrapper.style.display = 'none';
                                    media.valid = false;
                                };
                                wrapper.appendChild(img);
                                
                            } else if (media.type === 'video') {
                                const vid = document.createElement('video');
                                vid.preload = "auto";
                                vid.className = "w-full h-auto block transition-transform duration-500 group-hover:scale-105";
                                
                                vid.onerror = () => {
                                    wrapper.style.display = 'none';
                                    media.valid = false;
                                };
                                vid.src = media.src;

                                const icon = document.createElement('div');
                                icon.className = 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-black/60 rounded-full flex items-center justify-center text-white pointer-events-none group-hover:bg-[#d4a853] group-hover:text-[#0c1220] transition-colors';
                                icon.innerHTML = '▶'; 
                                
                                wrapper.appendChild(vid);
                                wrapper.appendChild(icon);
                            }

                            const overlay = document.createElement('div');
                            overlay.className = "absolute inset-0 bg-[#d4a853]/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none";
                            wrapper.appendChild(overlay);

                            wrapper.onclick = () => {
                                if (media.valid) window.openLightbox(index);
                            };

                            galleryGrid.appendChild(wrapper);
                        });
                    }

                    window.openLightbox = function(index) {
                        currentIndex = index;
                        updateLightbox();
                        if (lightbox) lightbox.style.display = 'block';
                        document.body.style.overflow = 'hidden'; 
                    };

                    window.closeLightbox = function() {
                        if (lightbox) lightbox.style.display = 'none';
                        document.body.style.overflow = 'auto';
                        if (lightboxVideo) lightboxVideo.pause(); 
                    };

                    window.changeMedia = function(direction) {
                        let foundValidMedia = false;
                        let attempts = 0;

                        while (!foundValidMedia && attempts < mediaList.length) {
                            currentIndex += direction;
                            if (currentIndex >= mediaList.length) currentIndex = 0;
                            if (currentIndex < 0) currentIndex = mediaList.length - 1;
                            if (mediaList[currentIndex].valid) foundValidMedia = true;
                            attempts++;
                        }
                        if (foundValidMedia) updateLightbox();
                    };

                    function updateLightbox() {
                        const media = mediaList[currentIndex];
                        if (lightboxVideo) {
                            lightboxVideo.pause();
                            lightboxVideo.currentTime = 0;
                        }

                        if (media.type === 'image') {
                            if (lightboxImg) {
                                lightboxImg.src = media.src;
                                lightboxImg.style.display = 'block';
                            }
                            if (lightboxVideo) lightboxVideo.style.display = 'none';
                        } else if (media.type === 'video') {
                            if (lightboxVideo) {
                                lightboxVideo.src = media.src;
                                lightboxVideo.style.display = 'block';
                            }
                            if (lightboxImg) lightboxImg.style.display = 'none';
                        }
                    }

                    let touchstartX = 0;
                    let touchendX = 0;

                    if (lightbox) {
                        lightbox.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
                        lightbox.addEventListener('touchend', e => {
                            touchendX = e.changedTouches[0].screenX;
                            const swipeThreshold = 50; 
                            if (touchendX < touchstartX - swipeThreshold) window.changeMedia(1); 
                            if (touchendX > touchstartX + swipeThreshold) window.changeMedia(-1); 
                        });

                        lightbox.addEventListener('click', e => {
                            if (e.target === lightbox || e.target.className.includes('lightbox-content')) {
                                window.closeLightbox();
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error("Error fetching database:", error);
                });
        }

        window.initPage = initGalleryPage;
        initGalleryPage();
    </script>
    <script src="player.js"></script>
</body>
</html>
