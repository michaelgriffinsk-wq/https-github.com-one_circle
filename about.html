<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Circle | About</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0a0a0a; 
            color: #fff; 
            margin: 0; 
            line-height: 1.6;
        }
        
        /* Navigation */
        nav {
            background-color: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cc0000;
        }
        nav a { color: #fff; text-decoration: none; font-weight: bold; font-size: 0.9em; transition: color 0.2s;}
        nav a:hover { color: #cc0000; }
        nav span { font-weight: bold; letter-spacing: 1px; }
        
        /* Hero Section */
        header { 
            text-align: center; 
            padding: 80px 20px; 
            background: linear-gradient(180deg, #3a0000 0%, #0a0a0a 100%);
        }
        header h1 { margin: 0; font-size: 2.8em; text-transform: uppercase; letter-spacing: 3px; }
        header p { color: #aaa; font-size: 1.1em; max-width: 600px; margin: 20px auto 0; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 1.8em; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 30px; color: #cc0000; }

        /* About Section (Text + Image) */
        .about-content {
            display: flex;
            gap: 40px;
            align-items: center;
            margin-bottom: 60px;
        }
        .about-text { flex: 1; color: #ccc; font-size: 1.05em; }
        .about-image { 
            flex: 1; 
            background-color: #222; 
            height: 300px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Core Values Grid */
        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 80px;
        }
        .value-card {
            background-color: #111;
            border-left: 3px solid #cc0000;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .value-card h3 { margin-top: 0; color: #fff; font-size: 1.2em; display: flex; align-items: center; gap: 10px;}
        .value-card p { color: #aaa; font-size: 0.95em; margin-bottom: 0; }

        @media (max-width: 768px) {
            .about-content { flex-direction: column; }
            .about-image { width: 100%; height: 250px; }
        }

        /* Team Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        /* Team Cards */
        .team-card {
            background-color: #151515;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .team-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(204, 0, 0, 0.2); }
        
        /* UPDATED: Allows free-form height for team photos */
        .team-photo { 
            width: 100%; 
            height: auto; 
            min-height: 150px;
            background-color: #222; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            overflow: hidden;
        }
        
        .team-name { margin: 15px 0 5px 0; font-size: 1.3em; color: #fff; }
        .team-role { margin: 0; color: #cc0000; font-size: 0.9em; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        /* Footer */
        footer { text-align: center; padding: 40px 20px; font-size: 0.85em; color: #555; border-top: 1px solid #222; margin-top: 50px; }
        .footer-links { list-style: none; padding: 0; display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .footer-links a { color: #cc0000; text-decoration: none; font-weight: bold; font-size: 1.1em;}
        .footer-links a:hover { text-decoration: underline; }

        /* =========================================
           ADMIN EDIT MODE STYLES
           ========================================= */
        .admin-toolbar {
            display: none; background: #111; padding: 15px 25px; 
            justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #cc0000; position: sticky; 
            top: 0; z-index: 9999;
        }
        .admin-btn {
            background: #cc0000; color: white; border: none; padding: 8px 16px; 
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .admin-btn:hover { background: #ff1a1a; }
        
        .about-editable { position: relative; transition: all 0.2s; }
        .active-edit {
            outline: 2px dashed #cc0000; outline-offset: 4px; cursor: pointer; border-radius: 8px;
        }
        .active-edit:hover { background-color: rgba(204, 0, 0, 0.05); outline: 3px solid #cc0000; }
        .active-edit::after {
            content: '✎ Click to Edit'; position: absolute; top: 10px; right: 10px;
            background: #cc0000; color: white; padding: 5px 12px; font-size: 12px;
            font-weight: bold; border-radius: 4px; opacity: 0; transition: opacity 0.2s;
            pointer-events: none; z-index: 10;
        }
        .active-edit:hover::after { opacity: 1; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #111; width: 100%; max-width: 600px;
            border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- ADMIN TOOLBAR (Hidden by Default) -->
    <div class="admin-toolbar" id="adminToolbar">
        <h1 style="margin: 0; font-size: 1.2em; color: white;">One Circle <span style="font-size: 0.8em; color: #888; font-weight: normal;">About Editor</span></h1>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div style="color: white; font-weight: bold; font-size: 0.9em; border-right: 1px solid #333; padding-right: 20px;">Edit Mode ON</div>
            <button class="admin-btn" onclick="publishAboutToGitHub()">Publish About Page</button>
        </div>
    </div>

    <nav>
        <a href="index.html" id="backLink">← Back to Home</a>
        <span>ONE CIRCLE</span>
    </nav>

    <!-- WRAPPED HEADER IN EDITABLE DIV -->
    <header class="about-editable" id="headerEditZone">
        <h1 id="pageTitle">Loading...</h1>
        <p id="pageSubtitle"></p>
    </header>

    <div class="container">
        
        <h2 class="section-title">What is One Circle?</h2>
        <!-- WRAPPED STORY IN EDITABLE DIV -->
        <div class="about-content about-editable" id="storyEditZone">
            <div class="about-text" id="aboutTextContainer">
                <!-- Text Injected by JS -->
            </div>
            <!-- UPDATED: Added ID to target for group photo -->
            <div class="about-image" id="groupPhotoContainer">
                Group Photo Placeholder
            </div>
        </div>

        <h2 class="section-title">Our Values</h2>
        <div class="values-grid" id="valuesGrid">
            <!-- Core value cards injected by JS -->
        </div>

        <h2 class="section-title">Meet the Team</h2>
        <div class="team-grid" id="teamGrid">
            <!-- Team cards injected by JS -->
        </div>

    </div>

    <footer>
        <div id="footerLinksContainer">
            <!-- Footer links injected by JS -->
        </div>
        <p>&copy; 2026 One Circle. Maintained by Kebaso Michael Griffins.</p>
    </footer>

    <!-- ABOUT EDIT MODAL -->
    <div class="modal-overlay" id="aboutModal">
        <div class="modal-content">
            <div style="padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between;">
                <h2 style="margin: 0; color: #cc0000;">Edit About Content</h2>
                <button onclick="closeAboutModal()" style="background: none; border: none; color: #888; font-size: 1.5em; cursor: pointer;">&times;</button>
            </div>
            <div style="padding: 20px;">
                <label style="color: #ccc; display: block; margin-bottom: 5px;">Page Title</label>
                <input type="text" id="editTitle" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; margin-bottom: 15px; box-sizing: border-box;">
                
                <label style="color: #ccc; display: block; margin-bottom: 5px;">Hero Subtitle</label>
                <input type="text" id="editSubtitle" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; margin-bottom: 15px; box-sizing: border-box;">
                
                <label style="color: #ccc; display: block; margin-bottom: 5px;">Our Story</label>
                <textarea id="editStory" rows="6" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; font-family: inherit;"></textarea>
            </div>
            <div style="padding: 20px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeAboutModal()" style="background: #333; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button onclick="saveAboutModal()" class="admin-btn">Apply Changes</button>
            </div>
        </div>
    </div>

    <script>
        let globalAboutData = null;
        
        // Check if user came from Admin Panel with Edit Mode ON
        let isAdmin = sessionStorage.getItem('oneCircleAdmin') === 'true';

        fetch('about.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(aboutData => {
                globalAboutData = aboutData;
                renderAboutPage(aboutData);
                
                // Admin specific initialization
                if (isAdmin) {
                    // Show Toolbar
                    document.getElementById('adminToolbar').style.display = 'flex';
                    
                    // Route Back Button to Admin index instead of live index
                    document.getElementById('backLink').href = 'admin/index.html';
                    document.getElementById('backLink').textContent = '← Back to Admin Panel';
                    
                    // Activate dashed boxes and click-to-edit
                    const editZones = document.querySelectorAll('.about-editable');
                    editZones.forEach(zone => {
                        zone.classList.add('active-edit');
                        zone.addEventListener('click', openAboutModal);
                    });
                }
            })
            .catch(error => {
                console.error("Error fetching about data:", error);
                document.getElementById('pageTitle').textContent = 'Error';
                document.getElementById('aboutTextContainer').innerHTML = '<p style="color: red;">Failed to load data.</p>';
            });

        // Function to paint the UI
        function renderAboutPage(data) {
            document.getElementById('pageTitle').textContent = data.page_title;
            document.getElementById('pageSubtitle').textContent = data.hero_subtitle;

            const storyParagraphs = data.story.split('\n\n');
            let storyHTML = '';
            storyParagraphs.forEach(p => {
                storyHTML += `<p>${p.replace(/\n/g, '<br>')}</p>`;
            });
            document.getElementById('aboutTextContainer').innerHTML = storyHTML;

            // UPDATED: Load the Group Photo dynamically
            const groupPhotoContainer = document.getElementById('groupPhotoContainer');
            if (data.group_photo) {
                let groupImgPath = data.group_photo;
                if (groupImgPath.startsWith('/')) groupImgPath = groupImgPath.substring(1); 
                
                groupPhotoContainer.innerHTML = `<img src="${groupImgPath}" alt="One Circle Community" style="width: 100%; height: 100%; object-fit: cover; border-radius: 10px;">`;
                groupPhotoContainer.style.backgroundColor = "transparent"; 
                groupPhotoContainer.style.boxShadow = "none"; 
            }

            const valuesGrid = document.getElementById('valuesGrid');
            valuesGrid.innerHTML = '';
            data.core_values.forEach(value => {
                valuesGrid.innerHTML += `
                    <div class="value-card">
                        <h3><span>${value.icon}</span> ${value.title}</h3>
                        <p>${value.description}</p>
                    </div>
                `;
            });

            // UPDATED: Fix for GitHub Pages leading slash and free-form height for team photos
            const teamGrid = document.getElementById('teamGrid');
            teamGrid.innerHTML = ''; 
            data.team.forEach(member => {
                let imgPath = member.image;
                
                // Remove leading slash if Decap CMS added it
                if (imgPath && imgPath.startsWith('/')) {
                    imgPath = imgPath.substring(1); 
                }

                const imageHTML = imgPath 
                    ? `<img src="${imgPath}" alt="${member.name}" style="width: 100%; height: auto; display: block;">`
                    : `Photo`;

                teamGrid.innerHTML += `
                    <div class="team-card">
                        <div class="team-photo">${imageHTML}</div>
                        <h3 class="team-name">${member.name}</h3>
                        <p class="team-role">${member.role}</p>
                    </div>
                `;
            });

            const footerLinksContainer = document.getElementById('footerLinksContainer');
            let footerHTML = '<ul class="footer-links">';
            data.footer_links.forEach(link => {
                footerHTML += `<li><a href="${link.url}">${link.label}</a></li>`;
            });
            footerHTML += '</ul>';
            footerLinksContainer.innerHTML = footerHTML;
        }

        // ==========================================
        // MODAL LOGIC
        // ==========================================
        function openAboutModal() {
            if (!isAdmin) return;
            document.getElementById('editTitle').value = globalAboutData.page_title;
            document.getElementById('editSubtitle').value = globalAboutData.hero_subtitle;
            document.getElementById('editStory').value = globalAboutData.story;
            document.getElementById('aboutModal').style.display = 'flex';
        }

        function closeAboutModal() {
            document.getElementById('aboutModal').style.display = 'none';
        }

        function saveAboutModal() {
            // Update the global object in memory
            globalAboutData.page_title = document.getElementById('editTitle').value;
            globalAboutData.hero_subtitle = document.getElementById('editSubtitle').value;
            globalAboutData.story = document.getElementById('editStory').value;
            
            // Re-render the page instantly to show edits
            renderAboutPage(globalAboutData);
            closeAboutModal();
        }

        // ==========================================
        // GITHUB API SAVING LOGIC
        // ==========================================
        async function publishAboutToGitHub() {
            const token = prompt("Enter your GitHub Personal Access Token to publish About page updates:");
            if (!token) {
                alert("Publishing cancelled.");
                return;
            }

            const repoOwner = "michaelgriffinsk-wq";
            const repoName = "https-github.com-one_circle";
            const branch = "About-json-branch";
            const path = "about.json"; 

            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}`;

            try {
                // Get current SHA
                const getResponse = await fetch(`${apiUrl}?ref=${branch}`, {
                    headers: { 
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });
                
                if (!getResponse.ok) throw new Error("Could not fetch current file SHA.");
                const fileData = await getResponse.json();
                const currentSha = fileData.sha;

                // Encode Payload
                const updatedContent = JSON.stringify(globalAboutData, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(updatedContent)));

                // Push Update
                const putResponse = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Update About page content via custom Admin UI",
                        content: base64Content,
                        sha: currentSha,
                        branch: branch
                    })
                });

                if (putResponse.ok) {
                    alert("Success! About page changes have been published to GitHub.");
                } else {
                    const errorData = await putResponse.json();
                    console.error(errorData);
                    alert("Failed to publish: " + errorData.message);
                }
            } catch (error) {
                console.error("Error publishing:", error);
                alert("An error occurred. Check the browser console.");
            }
        }
    </script>
</body>
</html>
