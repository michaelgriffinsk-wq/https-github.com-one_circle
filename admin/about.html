<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Circle | Admin - Edit About</title>
    <style>
        /* Keeping your existing styles exactly the same */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0a0a0a; color: #fff; margin: 0; padding: 40px 20px; line-height: 1.6; }
        .admin-container { max-width: 800px; margin: 0 auto; background-color: #111; padding: 30px; border-radius: 10px; border-top: 3px solid #cc0000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { margin-top: 0; color: #fff; text-transform: uppercase; letter-spacing: 2px; font-size: 1.8em; }
        h2 { color: #cc0000; font-size: 1.2em; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px;}
        label { display: block; margin: 15px 0 5px; color: #aaa; font-weight: bold; font-size: 0.9em; }
        textarea, input { width: 100%; background-color: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 200px; resize: vertical; }
        textarea:focus, input:focus { outline: none; border-color: #cc0000; }
        .team-member { background-color: #1a1a1a; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 3px solid #555; display: flex; gap: 15px; align-items: center; }
        .team-inputs { flex: 1; display: flex; gap: 15px; }
        .team-inputs input { margin: 0; }
        button { background-color: #333; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #555; }
        button.add-btn { background-color: #1a1a1a; border: 1px dashed #555; width: 100%; padding: 15px; color: #aaa; }
        button.add-btn:hover { border-color: #cc0000; color: #cc0000; }
        button.remove-btn { background-color: #500; padding: 12px; }
        button.remove-btn:hover { background-color: #cc0000; }
        button.export-btn { background-color: #cc0000; width: 100%; font-size: 1.2em; padding: 15px; margin-top: 30px; text-transform: uppercase; letter-spacing: 1px; }
        button.export-btn:hover { background-color: #ff1a1a; }
        .nav-link { color: #cc0000; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .nav-link:hover { color: #ff1a1a; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Notice the ../ to go back to the root directory -->
        <a href="../about.html" class="nav-link">← Back to Live About Page</a>
        
        <h1>Edit About Content</h1>
        <p style="color: #aaa; font-size: 0.9em;">Update your story and team roster below, then download the new <strong>about.json</strong> file and save it in the root folder.</p>

        <!-- STORY SECTION -->
        <h2>Our Story</h2>
        <label for="storyText">Main Text (Press Enter twice for a new paragraph)</label>
        <textarea id="storyText"></textarea>

        <!-- TEAM SECTION -->
        <h2>Team Members</h2>
        <div id="teamContainer"></div>
        <button class="add-btn" onclick="addTeamMember()">+ Add New Team Member</button>

        <!-- EXPORT -->
        <button class="export-btn" onclick="exportJSON()">Download about.json</button>
    </div>

    <script>
        let aboutData = { story: "", team: [] };

        // Initialize the page by fetching the existing JSON from the root folder
        function initEditor() {
            fetch('../about.json')
                .then(response => {
                    if (!response.ok) throw new Error('Could not find about.json in root');
                    return response.json();
                })
                .then(data => {
                    aboutData = data;
                    // Format the raw \n strings back into real text box line breaks
                    document.getElementById('storyText').value = aboutData.story.replace(/\\n/g, '\n');
                    renderTeamMembers();
                })
                .catch(error => {
                    console.warn("No existing JSON found. Starting blank.", error);
                });
        }

        function renderTeamMembers() {
            const container = document.getElementById('teamContainer');
            container.innerHTML = ''; 

            aboutData.team.forEach((member, index) => {
                const row = document.createElement('div');
                row.className = 'team-member';
                row.innerHTML = `
                    <div class="team-inputs">
                        <input type="text" placeholder="Name" value="${member.name}" oninput="updateTeamMember(${index}, 'name', this.value)">
                        <input type="text" placeholder="Role" value="${member.role}" oninput="updateTeamMember(${index}, 'role', this.value)">
                    </div>
                    <button class="remove-btn" onclick="removeTeamMember(${index})" title="Remove Member">X</button>
                `;
                container.appendChild(row);
            });
        }

        function updateTeamMember(index, field, value) {
            aboutData.team[index][field] = value;
        }

        function addTeamMember() {
            aboutData.team.push({ name: "", role: "" });
            renderTeamMembers();
        }

        function removeTeamMember(index) {
            aboutData.team.splice(index, 1);
            renderTeamMembers();
        }

        function exportJSON() {
            const rawStory = document.getElementById('storyText').value;
            aboutData.story = rawStory.replace(/\n/g, '\\n');

            const jsonString = JSON.stringify(aboutData, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'about.json'; // When they download, they just need to save it to the root folder
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.onload = initEditor;
    </script>
</body>
</html>
