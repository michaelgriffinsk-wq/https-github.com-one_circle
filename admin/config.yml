backend:
  name: github
  repo: michaelgriffinsk-wq/https-github.com-one_circle
  branch: About-json-branch
  base_url: https://netlify-cms-github-oauth-provider-tau-silk.vercel.app/

# This defines where new uploads (like poster images or audio) are saved
media_folder: "uploads" 
public_folder: "uploads"

collections:
  # ==========================================
  # COMPARTMENT 1: EVENTS & SEASONS
  # ==========================================
  - name: "database"
    label: "Events & Seasons"
    files:
      - label: "Manage All Seasons"
        name: "seasons"
        file: "database.json"
        format: "json" # Tells the CMS to read/write strict JSON
        fields:
          - label: "Seasons List"
            name: "seasons"
            widget: "list"
            fields:
              - {label: "Season Number", name: "seasonNumber", widget: "number"}
              - {label: "Status", name: "status", widget: "select", options: ["upcoming", "past"]}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Location", name: "location", widget: "string", default: "One Circle"}
              - {label: "Poster Image", name: "posterImg", widget: "image", required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "YouTube Link", name: "youtubeLink", widget: "string", required: false}
              - {label: "Highlights", name: "highlights", widget: "list", required: false}
              
              - label: "Tracklist"
                name: "tracklist"
                widget: "list"
                required: false
                fields:
                  - {label: "Track ID", name: "trackId", widget: "number"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Artist", name: "artist", widget: "string", default: "One Circle"}
                  - {label: "Audio File", name: "file", widget: "file"}
              
              - label: "Gallery Configuration"
                name: "gallery"
                widget: "object"
                fields:
                  - {label: "Folder Name", name: "folderName", widget: "string"}
                  - {label: "File Prefix", name: "filePrefix", widget: "string"}
                  - {label: "Max Images", name: "maxImages", widget: "number"}
                  - {label: "Max Videos", name: "maxVideos", widget: "number"}

  # ==========================================
  # COMPARTMENT 2: STATIC PAGES (ABOUT & PROJECTS)
  # ==========================================
  - name: "pages"
    label: "Static Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "about.json"
        format: "json" 
        fields:
          - {label: "Page Title", name: "page_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string"}
          - {label: "Group Photo", name: "group_photo", widget: "image", required: false}
          - {label: "Our Story", name: "story", widget: "text"}
          
          - label: "Core Values"
            name: "core_values"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Icon (Emoji or Text)", name: "icon", widget: "string"}
          
          - label: "Team Members"
            name: "team"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Team Member Photo", name: "image", widget: "image", required: false}
              
          - label: "Footer Links"
            name: "footer_links"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

      - label: "Music & Projects Page"
        name: "projects"
        file: "projects.json"
        format: "json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Background Image", name: "image", widget: "image", required: false}
              - {label: "Spotify URL", name: "spotify_url", widget: "string"}
              - {label: "Apple Music URL", name: "apple_url", widget: "string"}
              - {label: "YouTube URL", name: "youtube_url", widget: "string"}
              
          - label: "Featured Release"
            name: "featured_release"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Release Type (e.g. New original EP)", name: "type", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Cover Image", name: "image", widget: "image", required: false}
              - {label: "Spotify URL", name: "spotify_url", widget: "string"}
              - {label: "Apple Music URL", name: "apple_url", widget: "string"}
              
          - label: "Latest Tracks"
            name: "tracks"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Metadata (e.g. Live EP)", name: "meta", widget: "string"}
              - {label: "Duration", name: "duration", widget: "string"}
              - {label: "Track Image", name: "image", widget: "image", required: false}
              - {label: "Audio Tone (Freq for preview)", name: "tone", widget: "number"}
              
          - label: "Watch & Worship Videos"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Video Title", name: "title", widget: "string"}
              - {label: "Video Type", name: "type", widget: "string"}
              - {label: "YouTube Link", name: "url", widget: "string"}
              - {label: "Thumbnail Image", name: "image", widget: "image", required: false}
              
          - label: "Moments (Photos)"
            name: "moments"
            widget: "list"
            field: {label: "Image", name: "image", widget: "image"}
