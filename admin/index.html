<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Circle | Admin Editor</title>
    
    <link rel="stylesheet" href="../style.css">

    <style>
        /* =========================================
           ADMIN-SPECIFIC STYLES ONLY
           ========================================= */
        .admin-toolbar { 
            background: #111; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #cc0000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 9999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white;
        }
        .admin-toolbar h1 { margin: 0; font-size: 1.2em; letter-spacing: 1px; }
        .admin-toolbar .status { font-size: 0.8em; color: #888; margin-left: 10px; font-weight: normal; }
        .controls { display: flex; gap: 20px; align-items: center; }
        
        .admin-btn { 
            background: #cc0000; color: white; border: none; padding: 8px 16px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .admin-btn:hover { background: #ff1a1a; }
        .admin-btn-secondary { background: #333; }
        .admin-btn-secondary:hover { background: #444; }
        
        .toggle-container { 
            display: flex; align-items: center; gap: 10px; font-size: 0.9em; 
            font-weight: bold; border-right: 1px solid #333; padding-right: 20px;
        }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: #444; transition: .3s; border-radius: 24px; 
        }
        .slider:before { 
            position: absolute; content: ""; height: 16px; width: 16px; 
            left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; 
        }
        input:checked + .slider { background-color: #cc0000; }
        input:checked + .slider:before { transform: translateX(20px); }

        .admin-editable { position: relative; transition: all 0.2s ease-in-out; }
        .admin-editable.active-edit { outline: 2px dashed #cc0000; outline-offset: 4px; cursor: pointer; border-radius: 8px; }
        .admin-editable.active-edit:hover { outline: 3px solid #cc0000; background-color: rgba(204, 0, 0, 0.05); }
        .admin-editable.active-edit::after {
            content: '✎ Edit Season'; position: absolute; top: 10px; right: 10px;
            background: #cc0000; color: white; padding: 5px 12px; font-size: 12px;
            font-weight: bold; border-radius: 4px; opacity: 0; transition: opacity 0.2s;
            pointer-events: none; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .admin-editable.active-edit:hover::after { opacity: 1; }
        /* REMOVED the pointer-events: none rule so buttons work! */

        /* =========================================
           MODAL UI STYLES
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #111; width: 100%; max-width: 600px;
            border-radius: 10px; border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
            max-height: 90vh;
        }
        .modal-header {
            padding: 20px; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { margin: 0; font-size: 1.5em; color: #cc0000; }
        .close-modal {
            background: none; border: none; color: #888; font-size: 1.5em;
            cursor: pointer; transition: color 0.2s;
        }
        .close-modal:hover { color: white; }
        
        .modal-body {
            padding: 20px; overflow-y: auto; flex-grow: 1;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; background: #222; border: 1px solid #444;
            color: white; border-radius: 4px; font-family: inherit; box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus { outline: 1px solid #cc0000; border-color: #cc0000; }
        
        .modal-footer {
            padding: 20px; border-top: 1px solid #333;
            display: flex; justify-content: flex-end; gap: 10px;
        }
    </style>
  </head>
  <body>
    <!-- ADMIN TOOLBAR -->
    <div class="admin-toolbar">
        <h1>One Circle <span class="status">Live Content Editor</span></h1>
        
        <div class="controls">
            <div class="toggle-container">
                <span>Edit Mode</span>
                <label class="switch">
                    <input type="checkbox" id="editToggle">
                    <span class="slider"></span>
                </label>
            </div>
            
            <button class="admin-btn admin-btn-secondary" onclick="publishToGitHub(globalDatabase, 'database.json', 'Update events via custom admin UI')">Publish Changes</button>
            <a href="decap.html" class="admin-btn" style="text-decoration: none; background-color: #0056b3;">Open Advanced CMS</a>
        </div>
    </div>

    <!-- MAIN WEBSITE MIRROR -->
    <nav>
      <h2>ONE CIRCLE</h2>
      <div class="nav-links">
        <a href="../index.html">Live Home</a>
        <a href="../about.html">Live About</a>
      </div>
    </nav>
    <header>
      <h1>Welcome to One Circle</h1>
      <p>A community of worship, music, and fellowship. Explore our past seasons and listen to our lists.</p>
    </header>
    <div class="container">
      
      <div id="upcomingContainer"></div>
      
      <div class="section-title">
          <span style="flex-grow: 1;">Past Events</span>
          <button id="addSeasonBtn" class="admin-btn" style="display: none; margin-left: auto;">+ Add Season</button>
      </div>
      <div class="event-grid" id="pastGrid">
        <!-- Cards Injected by JS -->
      </div>
    </div>
    <footer>
      <p>© 2026 One Circle. Maintained by Kebaso Michael Griffins.</p>
    </footer>

    <!-- EDIT/ADD MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Edit Season</h2>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="seasonForm">
                    <input type="hidden" id="editIndex">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="seasonStatus">
                            <option value="past">Past Event</option>
                            <option value="upcoming">Upcoming Event</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Season Title</label>
                        <input type="text" id="seasonTitleInput" placeholder="e.g. Season 5">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="text" id="seasonDate" placeholder="e.g. Oct 2025">
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="seasonLocation" placeholder="e.g. Nairobi">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="seasonDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Highlights (Comma separated)</label>
                        <input type="text" id="seasonHighlights" placeholder="e.g. Worship, Praise, Fellowship">
                    </div>
                    <div class="form-group">
                        <label>Poster Image Path (Upload via Advanced CMS)</label>
                        <input type="text" id="seasonPoster" placeholder="e.g. uploads/poster.jpg">
                    </div>
                    <div class="form-group">
                        <label>YouTube Link</label>
                        <input type="text" id="seasonYoutube" placeholder="https://youtube.com/...">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="admin-btn admin-btn-secondary" id="cancelModalBtn">Cancel</button>
                <button class="admin-btn" id="saveModalBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- ADMIN LOGIC & DATA FETCHING -->
    <script>
        const upcomingContainer = document.getElementById('upcomingContainer');
        const pastGrid = document.getElementById('pastGrid');
        const editToggle = document.getElementById('editToggle');
        const addSeasonBtn = document.getElementById('addSeasonBtn');
        
        // Modal Elements
        const editModal = document.getElementById('editModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const saveModalBtn = document.getElementById('saveModalBtn');
        
        // UPDATED: Now fetches the state from sessionStorage
        let isEditMode = sessionStorage.getItem('oneCircleAdmin') === 'true';
        let globalDatabase = null;

        // Apply UI state on load
        if(isEditMode) {
            editToggle.checked = true;
        }

        // Fetch Initial Data
        function loadData() {
            fetch('../database.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(siteDatabase => {
                    globalDatabase = siteDatabase; 
                    renderUI(siteDatabase);
                })
                .catch(error => {
                    console.error("Error:", error);
                    pastGrid.innerHTML = `<p style="color: red;">Failed to load events.</p>`;
                });
        }

        // Render the HTML based on JSON
        function renderUI(siteDatabase) {
            upcomingContainer.innerHTML = '';
            pastGrid.innerHTML = '';

            siteDatabase.seasons.forEach((season, index) => {
                if (season.status === 'upcoming') {
                    upcomingContainer.innerHTML = `
                        <h2 class="section-title">Next Event</h2>
                        <div class="upcoming-card admin-editable" data-index="${index}">
                            <div class="upcoming-info">
                                <h3>${season.title}</h3>
                                <p class="event-details">📅 ${season.date} &nbsp;|&nbsp; 📍 ${season.location}</p>
                                <p>${season.description || ''}</p>
                            </div>
                            <div class="upcoming-action">
                                <a href="#" class="btn disabled">More Info Soon</a>
                            </div>
                        </div>
                    `;
                } else if (season.status === 'past') {
                    let highlightsHTML = '';
                    if(season.highlights) {
                        season.highlights.forEach(item => { highlightsHTML += `<li>${item}</li>`; });
                    }

                    const imageHTML = season.posterImg 
                        ? `<img src="../${season.posterImg}" alt="${season.title} Poster" class="card-img">`
                        : `<div class="card-img" style="display: flex; align-items: center; justify-content: center; color: #555;">No Image</div>`;

                    let buttonsHTML = '';
                    const hasAudio = season.tracklist && season.tracklist.length > 0;
                    const hasGallery = season.gallery && (season.gallery.maxImages > 0 || season.gallery.maxVideos > 0);
                    const hasYouTube = season.youtubeLink && season.youtubeLink !== "";

                    if (hasAudio || hasGallery || hasYouTube) {
                        buttonsHTML += `<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">`;
                        if (hasAudio) buttonsHTML += `<a href="../playlist.html?season=${season.seasonNumber}" class="btn">Listen 🎧</a>`;
                        if (hasYouTube) buttonsHTML += `<a href="${season.youtubeLink}" target="_blank" class="btn" style="background-color: #cc0000;">Watch 📺</a>`;
                        if (hasGallery) buttonsHTML += `<a href="../gallery.html?season=${season.seasonNumber}" class="btn" style="background-color: #333;">Gallery 📸</a>`;
                        buttonsHTML += `</div>`;
                    } else {
                        buttonsHTML = `<div style="margin-top: 10px;"><a href="#" class="btn disabled">Media Coming Soon</a></div>`;
                    }
                    
                    pastGrid.innerHTML += `
                        <div class="card admin-editable" data-index="${index}">
                            ${imageHTML}
                            <div class="card-content">
                                <h3 class="card-title">${season.title}</h3>
                                <p style="font-size: 0.85em; color: #888; margin-top: 0;">${season.date}</p>
                                <ul class="card-list">${highlightsHTML}</ul>
                                ${buttonsHTML}
                            </div>
                        </div>
                    `;
                }
            });
            
            attachEditListeners();
            if(isEditMode) toggleEditBorders(true);
        }

        // Toggle Edit State (UPDATED: Saves to sessionStorage)
        editToggle.addEventListener('change', (e) => {
            isEditMode = e.target.checked;
            sessionStorage.setItem('oneCircleAdmin', isEditMode);
            toggleEditBorders(isEditMode);
        });

        function toggleEditBorders(active) {
            if (active) {
                document.body.classList.add('admin-mode-on');
                addSeasonBtn.style.display = 'block';
                document.querySelectorAll('.admin-editable').forEach(el => el.classList.add('active-edit'));
            } else {
                document.body.classList.remove('admin-mode-on');
                addSeasonBtn.style.display = 'none';
                document.querySelectorAll('.admin-editable').forEach(el => el.classList.remove('active-edit'));
            }
        }

        // Attach clicks to cards (UPDATED: Allows buttons inside cards to be clicked)
        function attachEditListeners() {
            document.querySelectorAll('.admin-editable').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (isEditMode) {
                        // Let link buttons trigger their normal behavior
                        if (e.target.closest('a')) return; 

                        e.preventDefault(); 
                        e.stopPropagation();
                        const index = card.getAttribute('data-index');
                        openModal(index);
                    }
                });
            });
        }

        // ==========================================
        // MODAL LOGIC
        // ==========================================
        
        function openModal(index = null) {
            editModal.style.display = 'flex';
            
            if (index !== null) {
                document.getElementById('modalTitle').innerText = 'Edit Season';
                document.getElementById('editIndex').value = index;
                const season = globalDatabase.seasons[index];
                
                document.getElementById('seasonStatus').value = season.status || 'past';
                document.getElementById('seasonTitleInput').value = season.title || '';
                document.getElementById('seasonDate').value = season.date || '';
                document.getElementById('seasonLocation').value = season.location || '';
                document.getElementById('seasonDescription').value = season.description || '';
                document.getElementById('seasonPoster').value = season.posterImg || '';
                document.getElementById('seasonYoutube').value = season.youtubeLink || '';
                document.getElementById('seasonHighlights').value = season.highlights ? season.highlights.join(', ') : '';
            } else {
                document.getElementById('modalTitle').innerText = 'Add New Season';
                document.getElementById('seasonForm').reset();
                document.getElementById('editIndex').value = 'new';
            }
        }

        function closeModal() {
            editModal.style.display = 'none';
        }

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        saveModalBtn.addEventListener('click', () => {
            const index = document.getElementById('editIndex').value;
            
            const updatedSeason = {
                status: document.getElementById('seasonStatus').value,
                title: document.getElementById('seasonTitleInput').value,
                date: document.getElementById('seasonDate').value,
                location: document.getElementById('seasonLocation').value,
                description: document.getElementById('seasonDescription').value,
                posterImg: document.getElementById('seasonPoster').value,
                youtubeLink: document.getElementById('seasonYoutube').value,
                highlights: document.getElementById('seasonHighlights').value.split(',').map(item => item.trim()).filter(item => item !== '')
            };

            if (index === 'new') {
                updatedSeason.tracklist = [];
                updatedSeason.gallery = { maxImages: 0, maxVideos: 0 };
                updatedSeason.seasonNumber = globalDatabase.seasons.length + 1;
                globalDatabase.seasons.push(updatedSeason);
            } else {
                globalDatabase.seasons[index] = { ...globalDatabase.seasons[index], ...updatedSeason };
            }

            renderUI(globalDatabase); 
            closeModal();
        });

        // ==========================================
        // GITHUB API SAVING LOGIC
        // ==========================================
        async function publishToGitHub(jsonData, filename, commitMessage) {
            const token = prompt("Enter your GitHub Personal Access Token to publish to the Live Site:");
            if (!token) {
                alert("Publishing cancelled. A token is required.");
                return;
            }

            const repoOwner = "michaelgriffinsk-wq";
            const repoName = "https-github.com-one_circle";
            const branch = "json-branch";
            const path = filename; 

            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}`;

            try {
                const getResponse = await fetch(`${apiUrl}?ref=${branch}`, {
                    headers: { 
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });
                
                if (!getResponse.ok) throw new Error("Could not fetch current file SHA.");
                const fileData = await getResponse.json();
                const currentSha = fileData.sha;

                const updatedContent = JSON.stringify(jsonData, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(updatedContent)));

                const putResponse = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: base64Content,
                        sha: currentSha,
                        branch: branch
                    })
                });

                if (putResponse.ok) {
                    alert("Success! Changes have been published to GitHub.");
                } else {
                    const errorData = await putResponse.json();
                    console.error(errorData);
                    alert("Failed to publish: " + errorData.message);
                }
            } catch (error) {
                console.error("Error publishing:", error);
                alert("An error occurred. Check the browser console.");
            }
        }

        // Start
        loadData();
    </script>
  </body>
</html>
