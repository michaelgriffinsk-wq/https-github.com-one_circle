<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Circle | Playlist</title>
    
    <!-- Tailwind CSS & Fonts matching projects.html -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink: #0a0a0b;
            --paper: #f5efe5;
            --gold: #d8a64d;
            --muted: #aaa398;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "DM Sans", sans-serif; background: var(--ink); color: var(--paper); padding-bottom: 100px; }
        .serif { font-family: "Fraunces", serif; }
        .grain {
            pointer-events: none; position: fixed; inset: 0; z-index: 60; opacity: .05;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }
        .top-nav { background: rgba(10,10,11,.82); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .hero-image::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(0deg, var(--ink) 0%, rgba(10,10,11,.7) 50%, rgba(10,10,11,.4) 100%);
        }
        
        .eyebrow { letter-spacing: .18em; text-transform: uppercase; font-size: .7rem; font-weight: 700; color: var(--gold); }
        
        /* Tracklist Styles */
        .track-row { border-bottom: 1px solid rgba(245,239,229,.1); transition: background .2s ease; cursor: pointer; }
        .track-row:hover { background: rgba(245,239,229,.05); }
        .track-row.active { background: rgba(216, 166, 77, 0.1); border-left: 3px solid var(--gold); }
        .track-row.active .track-title { color: var(--gold); }

        /* Master Play Button */
        .master-play {
            background: var(--gold); color: var(--ink); width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, background 0.2s; box-shadow: 0 10px 30px rgba(216, 166, 77, 0.3);
        }
        .master-play:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* Progress Bars */
        .progress-container { width: 100%; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px; cursor: pointer; }
        .progress-bar { height: 100%; background: var(--gold); width: 0%; border-radius: 2px; }
        
        /* Bottom Mini Player */
        .bottom-player {
            position: fixed; bottom: 0; left: 0; w: 100%; width: 100%;
            background: rgba(10,10,11,0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; cursor: pointer;
        }
        
        /* Full Screen Player */
        .full-player {
            position: fixed; top: 100vh; left: 0; width: 100%; height: 100vh;
            background: var(--ink); z-index: 2000;
            transition: top 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            display: flex; flex-direction: column;
        }
        .full-player.active { top: 0; }
        
        .toggle-btn { color: var(--muted); transition: color 0.2s; }
        .toggle-btn.active { color: var(--gold); }
    </style>
</head>
<body>
    <div class="grain" aria-hidden="true"></div>

    <header class="top-nav sticky top-0 z-50">
        <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-5 py-4 md:px-8">
            <a href="index.html" class="text-sm font-bold tracking-[0.24em] text-[#f5efe5] hover:text-[#d8a64d] transition uppercase">← BACK</a>
            <div class="hidden items-center gap-7 text-xs font-semibold uppercase tracking-[0.16em] text-[#aaa398] md:flex">
                <a href="projects.html" class="transition hover:text-[#d8a64d]">Music</a> 
                <a href="about.html" class="transition hover:text-[#d8a64d]">About</a> 
            </div>
        </nav>
    </header>

    <main id="top" class="relative z-10 mx-auto w-full max-w-4xl px-5 pt-10 md:px-8">
        
        <!-- Dynamic Header (Injected by JS) -->
        <div id="dynamicHeader" class="flex flex-col items-center text-center mb-12">
            <!-- Content Injected -->
        </div>

        <div class="flex items-center justify-between mb-6">
            <h2 class="serif text-3xl font-semibold text-[#f5efe5]">Tracklist</h2>
            <button class="master-play" id="masterPlayBtn"><i data-lucide="play" class="w-6 h-6 fill-current"></i></button>
        </div>

        <div id="trackList" class="mb-20">
            <!-- Tracks injected by JS -->
        </div>
    </main>

    <audio id="audioPlayer"></audio>

    <!-- Mini Player -->
    <div class="bottom-player pb-safe" id="miniPlayer">
        <div class="progress-container !h-1 rounded-none" id="progressContainer" onclick="event.stopPropagation(); seekAudio(event, this)">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="mx-auto max-w-4xl px-5 py-4 flex items-center justify-between">
            <div class="flex flex-col">
                <p class="font-bold text-[#f5efe5] text-sm" id="nowTitle">Select a track</p>
                <p class="text-xs text-[#aaa398] mt-1" id="nowArtist">One Circle</p>
            </div>
            <div class="flex items-center gap-4 text-[#f5efe5]" onclick="event.stopPropagation()">
                <button id="prevBtn" class="hover:text-[#d8a64d] transition"><i data-lucide="skip-back" class="w-5 h-5 fill-current"></i></button>
                <button id="playPauseBtn" class="hover:text-[#d8a64d] transition"><i data-lucide="play" class="w-6 h-6 fill-current"></i></button>
                <button id="nextBtn" class="hover:text-[#d8a64d] transition"><i data-lucide="skip-forward" class="w-5 h-5 fill-current"></i></button>
            </div>
        </div>
    </div>

    <!-- Full Screen Player -->
    <div class="full-player" id="fullPlayer">
        <!-- Background Grain for Full Player -->
        <div class="grain" aria-hidden="true"></div>
        
        <div class="relative z-10 flex flex-col h-full px-6 py-8 md:max-w-md md:mx-auto w-full">
            
            <div class="flex justify-between items-center mb-8">
                <button id="closeFullPlayer" class="text-[#f5efe5] hover:text-[#d8a64d]"><i data-lucide="chevron-down" class="w-8 h-8"></i></button>
                <div class="text-center">
                    <p class="eyebrow !text-[10px] mb-1">Playing from Playlist</p>
                    <p class="text-[#f5efe5] font-bold text-sm" id="fpPlaylistTitle">Loading...</p>
                </div>
                <div class="w-8"></div> <!-- Spacer -->
            </div>
            
            <div class="flex-grow flex items-center justify-center mb-8">
                <img src="" alt="Album Art" id="fpArt" class="w-full aspect-square object-cover rounded-2xl shadow-2xl shadow-black/50">
            </div>
            
            <div class="mb-6">
                <h2 class="serif text-3xl font-semibold text-[#f5efe5] mb-1" id="fpTitle">Select a track</h2>
                <p class="text-lg text-[#aaa398]" id="fpArtist">One Circle</p>
            </div>
            
            <div class="mb-8">
                <div class="progress-container" id="fpProgressContainer" onclick="seekAudio(event, this)">
                    <div class="progress-bar" id="fpProgressBar"></div>
                </div>
                <div class="flex justify-between text-xs text-[#aaa398] mt-2 font-medium">
                    <span id="currentTimeDisplay">0:00</span>
                    <span id="durationDisplay">0:00</span>
                </div>
            </div>
            
            <div class="flex justify-between items-center px-2">
                <button id="shuffleBtn" class="toggle-btn"><i data-lucide="shuffle" class="w-6 h-6"></i></button>
                <button id="fpPrevBtn" class="text-[#f5efe5] hover:text-[#d8a64d] transition"><i data-lucide="skip-back" class="w-8 h-8 fill-current"></i></button>
                <button id="fpPlayPauseBtn" class="w-16 h-16 bg-[#d8a64d] text-[#17120a] rounded-full flex items-center justify-center transition hover:scale-105"><i data-lucide="play" class="w-8 h-8 fill-current ml-1"></i></button>
                <button id="fpNextBtn" class="text-[#f5efe5] hover:text-[#d8a64d] transition"><i data-lucide="skip-forward" class="w-8 h-8 fill-current"></i></button>
                <button id="repeatBtn" class="toggle-btn"><i data-lucide="repeat" class="w-6 h-6"></i></button>
            </div>
            
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        function formatImgPath(path) {
            if (!path) return '';
            return path.startsWith('/') ? path.substring(1) : path;
        }

        fetch('database.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(siteDatabase => {
                const urlParams = new URLSearchParams(window.location.search);
                const seasonNumber = parseInt(urlParams.get('season'));
                const seasonData = siteDatabase.seasons.find(s => s.seasonNumber === seasonNumber);

                if (!seasonData) {
                    document.getElementById('trackList').innerHTML = '<h2 class="text-center text-[#d8a64d] mt-10">Playlist not found.</h2>';
                    throw new Error("Season not found in database.");
                }

                // Header Injection
                document.title = `One Circle | ${seasonData.title}`;
                const posterUrl = formatImgPath(seasonData.posterImg);
                
                document.getElementById('dynamicHeader').innerHTML = `
                    ${posterUrl ? `<img src="${posterUrl}" alt="${seasonData.title}" class="w-48 h-48 md:w-64 md:h-64 object-cover rounded-2xl shadow-xl shadow-black/50 mb-6">` : ''}
                    <h1 class="serif text-4xl md:text-6xl font-semibold text-[#f5efe5] mb-3">${seasonData.title}</h1>
                    <p class="eyebrow">${seasonData.date}</p>
                `;

                document.getElementById('fpPlaylistTitle').innerText = seasonData.title;
                const fpArt = document.getElementById('fpArt');
                if (posterUrl) { fpArt.src = posterUrl; } else { fpArt.style.display = 'none'; }

                // Format Tracklist
                const playlist = seasonData.tracklist.map((track, index) => {
                    return {
                        id: index,
                        title: track.title,
                        artist: track.artist || "One Circle", 
                        file: formatImgPath(track.file)
                    };
                });

                // PLAYER LOGIC
                let currentTrackIndex = 0;
                let isPlaying = false;
                let isShuffle = false;
                let isRepeat = false;

                const audio = document.getElementById('audioPlayer');
                const trackListEl = document.getElementById('trackList');
                
                const miniPlayer = document.getElementById('miniPlayer');
                const masterPlayBtn = document.getElementById('masterPlayBtn');
                const playPauseBtn = document.getElementById('playPauseBtn');
                const nowTitle = document.getElementById('nowTitle');
                const nowArtist = document.getElementById('nowArtist');
                const progressBar = document.getElementById('progressBar');
                
                const fullPlayer = document.getElementById('fullPlayer');
                const fpTitle = document.getElementById('fpTitle');
                const fpArtist = document.getElementById('fpArtist');
                const fpProgressBar = document.getElementById('fpProgressBar');
                const currentTimeDisplay = document.getElementById('currentTimeDisplay');
                const durationDisplay = document.getElementById('durationDisplay');
                const fpPlayPauseBtn = document.getElementById('fpPlayPauseBtn');
                const shuffleBtn = document.getElementById('shuffleBtn');
                const repeatBtn = document.getElementById('repeatBtn');

                function renderTracklist() {
                    trackListEl.innerHTML = '';
                    playlist.forEach((track, index) => {
                        const div = document.createElement('div');
                        div.className = 'track-row track-item flex items-center justify-between px-4 py-4 rounded-xl';
                        div.innerHTML = `
                            <div class="flex items-center gap-4">
                                <span class="text-[#aaa398] font-bold text-sm w-4">${index + 1}</span>
                                <div>
                                    <h3 class="track-title font-bold text-[#f5efe5] text-[16px]">${track.title}</h3>
                                    <p class="text-sm text-[#aaa398] mt-1">${track.artist}</p>
                                </div>
                            </div>
                            <i data-lucide="play-circle" class="w-5 h-5 text-[#aaa398]"></i>
                        `;
                        div.onclick = () => loadAndPlayTrack(index);
                        trackListEl.appendChild(div);
                    });
                    lucide.createIcons();
                }

                function loadAndPlayTrack(index) {
                    currentTrackIndex = index;
                    const track = playlist[index];
                    
                    nowTitle.innerText = track.title;
                    nowArtist.innerText = track.artist;
                    fpTitle.innerText = track.title;
                    fpArtist.innerText = track.artist;
                    
                    document.querySelectorAll('.track-item').forEach((item, i) => {
                        item.classList.toggle('active', i === index);
                    });

                    audio.src = track.file;
                    const playPromise = audio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            isPlaying = true;
                            updatePlayButtons();
                        }).catch(error => {
                            console.error("Playback failed:", error);
                            isPlaying = false;
                            updatePlayButtons();
                        });
                    }
                }

                function togglePlay() {
                    if (!audio.src) { loadAndPlayTrack(0); return; }
                    if (isPlaying) { audio.pause(); isPlaying = false; } 
                    else { audio.play(); isPlaying = true; }
                    updatePlayButtons();
                }

                function updatePlayButtons() {
                    const iconHTML = isPlaying ? '<i data-lucide="pause" class="w-6 h-6 fill-current"></i>' : '<i data-lucide="play" class="w-6 h-6 fill-current"></i>';
                    const fpIconHTML = isPlaying ? '<i data-lucide="pause" class="w-8 h-8 fill-current"></i>' : '<i data-lucide="play" class="w-8 h-8 fill-current ml-1"></i>';
                    
                    playPauseBtn.innerHTML = iconHTML;
                    masterPlayBtn.innerHTML = isPlaying ? '<i data-lucide="pause" class="w-6 h-6 fill-current"></i>' : '<i data-lucide="play" class="w-6 h-6 fill-current ml-1"></i>';
                    fpPlayPauseBtn.innerHTML = fpIconHTML;
                    lucide.createIcons();
                }

                function playNext() {
                    if (isShuffle) {
                        let randomIndex = currentTrackIndex;
                        while (randomIndex === currentTrackIndex && playlist.length > 1) {
                            randomIndex = Math.floor(Math.random() * playlist.length);
                        }
                        loadAndPlayTrack(randomIndex);
                    } else {
                        let nextIndex = currentTrackIndex + 1;
                        if (nextIndex >= playlist.length) nextIndex = 0;
                        loadAndPlayTrack(nextIndex);
                    }
                }

                function playPrev() {
                    let prevIndex = currentTrackIndex - 1;
                    if (prevIndex < 0) prevIndex = playlist.length - 1;
                    loadAndPlayTrack(prevIndex);
                }

                masterPlayBtn.onclick = togglePlay;
                playPauseBtn.onclick = togglePlay;
                fpPlayPauseBtn.onclick = togglePlay;
                
                document.getElementById('nextBtn').onclick = playNext;
                document.getElementById('fpNextBtn').onclick = playNext;
                document.getElementById('prevBtn').onclick = playPrev;
                document.getElementById('fpPrevBtn').onclick = playPrev;

                shuffleBtn.onclick = () => {
                    isShuffle = !isShuffle;
                    shuffleBtn.classList.toggle('active', isShuffle);
                };
                
                repeatBtn.onclick = () => {
                    isRepeat = !isRepeat;
                    audio.loop = isRepeat;
                    repeatBtn.classList.toggle('active', isRepeat);
                };

                function formatTime(seconds) {
                    if (isNaN(seconds)) return "0:00";
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.floor(seconds % 60);
                    return mins + ":" + (secs < 10 ? "0" : "") + secs;
                }

                audio.addEventListener('timeupdate', () => {
                    if (audio.duration) {
                        const percent = (audio.currentTime / audio.duration) * 100;
                        progressBar.style.width = percent + '%';
                        fpProgressBar.style.width = percent + '%';
                        currentTimeDisplay.innerText = formatTime(audio.currentTime);
                        durationDisplay.innerText = formatTime(audio.duration);
                    }
                });

                window.seekAudio = function(e, container) {
                    const width = container.clientWidth;
                    const clickX = e.offsetX;
                    const duration = audio.duration;
                    if (duration) { audio.currentTime = (clickX / width) * duration; }
                };

                audio.addEventListener('ended', () => { if (!isRepeat) { playNext(); } });

                miniPlayer.addEventListener('click', () => fullPlayer.classList.add('active'));
                document.getElementById('closeFullPlayer').addEventListener('click', () => fullPlayer.classList.remove('active'));

                renderTracklist();
            })
            .catch(error => {
                console.error("Error fetching database:", error);
            });
    </script>
    <script 
        src="player.js">   
    </script>
</body>
</html>
