<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Circle | Official Website</title>
    <!-- Linked to the new shared CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>ONE CIRCLE</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <header>
        <h1>Welcome to One Circle</h1>
        <p>A community of worship, music, and fellowship. Explore our past seasons and listen to our lists.</p>
    </header>

    <div class="container">
        
        <!-- UPCOMING EVENT SECTION (Injected by JS) -->
        <div id="upcomingContainer"></div>

        <!-- PAST EVENTS SECTION -->
        <h2 class="section-title">Past Events</h2>
        <div class="event-grid" id="pastGrid">
            <!-- Cards Injected by JS -->
        </div>

    </div>

    <footer>
        <p>&copy; 2026 One Circle. Maintained by Kebaso Michael Griffins.</p>
    </footer>

    <script>
        const upcomingContainer = document.getElementById('upcomingContainer');
        const pastGrid = document.getElementById('pastGrid');

        fetch('database.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(siteDatabase => {
                siteDatabase.seasons.forEach(season => {
                    
                    if (season.status === 'upcoming') {
                        upcomingContainer.innerHTML = `
                            <h2 class="section-title">Next Event</h2>
                            <div class="upcoming-card">
                                <div class="upcoming-info">
                                    <h3>${season.title}</h3>
                                    <p class="event-details">📅 ${season.date} &nbsp;|&nbsp; 📍 ${season.location}</p>
                                    <p>${season.description}</p>
                                </div>
                                <div class="upcoming-action">
                                    <a href="#" class="btn disabled">More Info Soon</a>
                                </div>
                            </div>
                        `;
                    } 
                    
                    else if (season.status === 'past') {
                        
                        let highlightsHTML = '';
                        season.highlights.forEach(item => {
                            highlightsHTML += `<li>${item}</li>`;
                        });

                        const imageHTML = season.posterImg 
                            ? `<img src="${season.posterImg}" alt="${season.title} Poster" class="card-img">`
                            : `<div class="card-img" style="display: flex; align-items: center; justify-content: center; color: #555;">Image Placeholder</div>`;

                        let buttonsHTML = '';
                        const hasAudio = season.tracklist && season.tracklist.length > 0;
                        const hasGallery = season.gallery && (season.gallery.maxImages > 0 || season.gallery.maxVideos > 0);
                        const hasYouTube = season.youtubeLink && season.youtubeLink !== "";

                        if (hasAudio || hasGallery || hasYouTube) {
                            buttonsHTML += `<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">`;
                            
                            if (hasAudio) {
                                buttonsHTML += `<a href="playlist.html?season=${season.seasonNumber}" class="btn">Listen 🎧</a>`;
                            }
                            if (hasYouTube) {
                                buttonsHTML += `<a href="${season.youtubeLink}" target="_blank" class="btn" style="background-color: #cc0000;">Watch 📺</a>`;
                            }
                            if (hasGallery) {
                                buttonsHTML += `<a href="gallery.html?season=${season.seasonNumber}" class="btn" style="background-color: #333;">Gallery 📸</a>`;
                            }
                            
                            buttonsHTML += `</div>`;
                        } else {
                            buttonsHTML = `<div style="margin-top: 10px;"><a href="#" class="btn disabled">Media Coming Soon</a></div>`;
                        }
                        
                        pastGrid.innerHTML += `
                            <div class="card">
                                ${imageHTML}
                                <div class="card-content">
                                    <h3 class="card-title">${season.title}</h3>
                                    <p style="font-size: 0.85em; color: #888; margin-top: 0;">${season.date}</p>
                                    <ul class="card-list">
                                        ${highlightsHTML}
                                    </ul>
                                    ${buttonsHTML}
                                </div>
                            </div>
                        `;
                    }
                });
            })
            .catch(error => {
                console.error("Error loading the database:", error);
                pastGrid.innerHTML = `<p style="color: red;">Failed to load events. Please ensure database.json exists and is formatted correctly.</p>`;
            });
    </script>
</body>
</html>
